<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Rubber</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #loading-screen {
            width: 100%;
            height: 100%;
            background-color: #231F20;
            position: absolute;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #centerImage {
            max-width: 100%;
            max-height: 100%;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #231F20;
            /*background: #F3FF20;*/
        }

        #loading-text {
            position: absolute;
            color: white;
            font-family: 'Arial';
            font-size: 1em;
            margin-top: 126px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 2;
        }
    </style>
</head>
<body>
<div id="loading-screen">
    <img id="centerImage" src="https://storage.googleapis.com/novusis-data/rubber/rubber_loadig_pic.jpg">
    <span id="loading-text">0%</span>
</div>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<script src="Build/rubber.loader.js"></script>
<script src="debug_console_log.js"></script>
<script>

    const url = new URL(window.location.href);
    let params = new URLSearchParams(url.search);
    console_log('r:' + params.get('r'))
    console_log('u:' + params.get('u'))
    console_log('g:' + params.get('g'))
    console_log('s:' + params.get('s'))
    
    var globalUnityInstance;
    
    let script = document.createElement('script');
    script.src = "https://telegram.org/js/games.js";
    document.head.appendChild(script);
    script.onerror = function (e) {
        console_log('Script load error: ' + e);
    };

    script.onload = function () {
        console_log('script.onload');

        // Проверьте доступность объекта и его методов
        if (typeof TelegramGameProxy !== 'undefined') {
            console_log('TelegramGameProxy is available');
            console_log('Methods: ' + Object.keys(TelegramGameProxy).join(', '));

            // Проверьте доступность конкретных методов
            if (typeof TelegramGameProxy.shareScore === 'function') {
                console_log('shareScore method is available');
            } else {
                console_log('shareScore method is NOT available');
            }

            if (typeof TelegramGameProxy !== 'undefined') {
                if (typeof TelegramGameProxy !== 'undefined') {
                    TelegramGameProxy.onEvent('eventType', (eventType, eventData) => {
                        console_log('Event received: ' + eventType + ', Data: ' + JSON.stringify(eventData));
                    });
                }
            }
        } else {
            console_log('TelegramGameProxy is not available');
        }
    };


    window.addEventListener('load', () => {

        var canvas = document.querySelector("#unity-canvas");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
        }

        createUnityInstance(canvas, {
            dataUrl: "Build/rubber.data",
            frameworkUrl: "Build/rubber.framework.js",
            codeUrl: "Build/rubber.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "novusis.ddns.net",
            productVersion: "0.3.12",
            productName: "rubber",
            matchWebGLToCanvasSize: true,
        }, (progress) => {
            // Отслеживание прогресса загрузки
            // console.log(`progress: ${100 * progress}%`);
            var loadingElement = document.getElementById("loading-text");
            loadingElement.textContent = `${Math.floor(progress * 100)}%`;
        }).then((unityInstance) => {
            // Загрузка завершена
            globalUnityInstance = unityInstance;
            console_log('load unity player complete!');
            var loadingscreen = document.getElementById("loading-screen");
            loadingscreen.parentNode.removeChild(loadingscreen);
        }).catch((err) => {
            // Обработка ошибок во время загрузки
            console.error(err);
        });
    });

    function shareScore() {
        if (typeof TelegramGameProxy !== 'undefined' && typeof TelegramGameProxy.shareScore === 'function') {
            console_log('start shareScore');
            TelegramGameProxy.shareScore();
            console_log('end shareScore');
        } else {
            console_log('shareScore method is not available');
        }
    }

    // BOT API

    function sendScore(score) {
        if (typeof TelegramGameProxy !== 'undefined' && typeof TelegramGameProxy.shareScore === 'function') {
            TelegramGameProxy.shareScore();
            console_log('start sendScore score: ' + score)
            // Создание объекта URLSearchParams для облегчения работы с параметрами запроса
            let userId = parseInt(params.get('u'));
            let game = params.get('g');
            fetch('https://novusis.ddns.net/api/share-score', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    userId: userId,
                    game: game,
                    scores: score
                })
            })
                .then(response => response.json())
                .then(data => {
                    console_log('Score shared successfully:' + data);
                    shareScore()
                })
                .catch((error) => {
                    console_log('Error:' + error);
                });
        } else {
            console_log('shareScore method is not available');
        }
    }

    // for unity execution 
    window.GetScores = function () {
        console_log('GetScore');
        let params = new URLSearchParams(url.search);
        globalUnityInstance.SendMessage("GameController", "SetScore", params.get('s'));
        console_log('SetScore complete!');
    }

    window.SendScores = function (scores) {
        sendScore(scores);
    }

</script>
</body>
</html>

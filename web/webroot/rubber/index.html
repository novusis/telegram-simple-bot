<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Rubber</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #231f20;
        }

        body {
            position: fixed;
            inset: 0;
            touch-action: none;
        }

        #unity-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #231f20;
        }

        #unity-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #231f20;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(180deg, rgba(255, 92, 35, 0.16), transparent 34%),
                #231f20;
        }

        #loading-logo {
            width: min(440px, 78vw);
            height: auto;
            filter: drop-shadow(0 14px 10px rgba(0, 0, 0, 0.45));
        }

        #loading-bar {
            width: min(340px, 72vw);
            height: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-radius: 999px;
            background: rgba(10, 8, 9, 0.72);
            box-shadow:
                inset 0 1px 2px rgba(0, 0, 0, 0.65),
                0 8px 20px rgba(0, 0, 0, 0.25);
        }

        #loading-bar-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background:
                linear-gradient(90deg, #ffe66d 0%, #ff8b2a 46%, #f01f16 100%);
            box-shadow: 0 0 16px rgba(255, 111, 35, 0.7);
            transition: width 120ms linear;
        }

        #loading-text {
            min-width: 72px;
            min-height: 34px;
            color: #fff3d1;
            font-size: 30px;
            font-weight: 900;
            line-height: 34px;
            text-align: center;
            font-variant-numeric: tabular-nums;
            text-shadow:
                0 3px 0 rgba(103, 16, 11, 0.7),
                0 10px 18px rgba(0, 0, 0, 0.38);
        }

        @media (max-width: 480px) {
            #loading-text {
                font-size: 24px;
                line-height: 30px;
            }
        }
    </style>
</head>
<body>
<div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>
<div id="loading-screen">
    <img id="loading-logo" src="rubber_logo.png" alt="Rubber">
    <div id="loading-bar">
        <div id="loading-bar-fill"></div>
    </div>
    <span id="loading-text">0%</span>
</div>

<script src="debug_console_log.js"></script>
<script>
    const buildUrl = "Build";
    const loaderUrl = buildUrl + "/rubber.loader.js";
    const url = new URL(window.location.href);
    const params = new URLSearchParams(url.search);

    console_log("r:" + params.get("r"));
    console_log("u:" + params.get("u"));
    console_log("g:" + params.get("g"));
    console_log("s:" + params.get("s"));

    let globalUnityInstance;
    let fullscreenRequested = false;

    const telegramScript = document.createElement("script");
    telegramScript.src = "https://telegram.org/js/games.js";
    document.head.appendChild(telegramScript);
    telegramScript.onerror = function (e) {
        console_log("Script load error: " + e);
    };

    telegramScript.onload = function () {
        console_log("script.onload");

        if (typeof TelegramGameProxy !== "undefined") {
            console_log("TelegramGameProxy is available");
            console_log("Methods: " + Object.keys(TelegramGameProxy).join(", "));

            if (typeof TelegramGameProxy.shareScore === "function") {
                console_log("shareScore method is available");
            } else {
                console_log("shareScore method is NOT available");
            }

            if (typeof TelegramGameProxy.onEvent === "function") {
                TelegramGameProxy.onEvent("eventType", (eventType, eventData) => {
                    console_log("Event received: " + eventType + ", Data: " + JSON.stringify(eventData));
                });
            } else {
                console_log("onEvent method is not available");
            }
        } else {
            console_log("TelegramGameProxy is not available");
        }
    };

    function requestBrowserFullscreen() {
        if (fullscreenRequested || document.fullscreenElement) {
            return;
        }

        fullscreenRequested = true;
        const target = document.documentElement;

        if (target.requestFullscreen) {
            target.requestFullscreen().catch(function () {
                fullscreenRequested = false;
            });
        }
    }

    function resizeCanvasToViewport(canvas) {
        canvas.style.width = window.innerWidth + "px";
        canvas.style.height = window.innerHeight + "px";
    }

    window.addEventListener("load", () => {
        const canvas = document.querySelector("#unity-canvas");
        resizeCanvasToViewport(canvas);

        window.addEventListener("resize", () => resizeCanvasToViewport(canvas));
        window.addEventListener("orientationchange", () => {
            setTimeout(() => resizeCanvasToViewport(canvas), 100);
        });

        window.addEventListener("pointerdown", requestBrowserFullscreen, { once: true });
        window.addEventListener("touchstart", requestBrowserFullscreen, { once: true, passive: true });

        const script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, {
                dataUrl: buildUrl + "/rubber.data.gz",
                frameworkUrl: buildUrl + "/rubber.framework.js.gz",
                codeUrl: buildUrl + "/rubber.wasm.gz",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "DefaultCompany",
                productName: "Rubber",
                productVersion: "0.1.4",
                matchWebGLToCanvasSize: true,
            }, (progress) => {
                const progressPercent = Math.floor(progress * 100);
                document.getElementById("loading-text").textContent = progressPercent + "%";
                document.getElementById("loading-bar-fill").style.width = progressPercent + "%";
            }).then((unityInstance) => {
                globalUnityInstance = unityInstance;
                console_log("load unity player complete!");
                document.getElementById("loading-screen").remove();
                resizeCanvasToViewport(canvas);
            }).catch((err) => {
                console.error(err);
                console_log("Unity load error: " + err);
            });
        };

        document.body.appendChild(script);
    });

    function shareScore() {
        if (typeof TelegramGameProxy !== "undefined" && typeof TelegramGameProxy.shareScore === "function") {
            console_log("start shareScore");
            TelegramGameProxy.shareScore();
            console_log("end shareScore");
        } else {
            console_log("shareScore method is not available");
        }
    }

    function sendScore(score) {
        if (typeof TelegramGameProxy !== "undefined" && typeof TelegramGameProxy.shareScore === "function") {
            TelegramGameProxy.shareScore();
            console_log("start sendScore score: " + score);

            const userId = parseInt(params.get("u"));
            const game = params.get("g");
            fetch("https://novusis.ddns.net/api/share-score", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    userId: userId,
                    game: game,
                    scores: score
                })
            })
                .then(response => response.json())
                .then(data => {
                    console_log("Score shared successfully:" + data);
                    shareScore();
                })
                .catch((error) => {
                    console_log("Error:" + error);
                });
        } else {
            console_log("shareScore method is not available");
        }
    }

    window.GetScores = function () {
        console_log("GetScore");
        const scoreParams = new URLSearchParams(url.search);
        globalUnityInstance.SendMessage("GameController", "SetScore", scoreParams.get("s"));
        console_log("SetScore complete!");
    };

    window.SendScores = function (scores) {
        sendScore(scores);
    };
</script>
</body>
</html>
